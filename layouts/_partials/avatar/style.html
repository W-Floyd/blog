{{- /* Shared by the home avatar and the dock that follows it to other pages. */ -}}
  <style>
    /* The cutout has no backdrop, so the ring gives the circle its edge; tinted from the
       text colour so it follows the colour scheme. */
    .avatar .relight {
      position: relative; display: inline-block; line-height: 0; border-radius: 50%;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      /* Lifted upper left, where the relight key sits. White rather than currentColor,
         which would darken that side in light mode. */
      background:
        radial-gradient(circle at 35% 30%, rgb(255 255 255 / 7%), transparent 70%),
        color-mix(in srgb, currentColor 5%, transparent);
      box-shadow: 0 0 0 .3rem color-mix(in srgb, currentColor 18%, transparent);
      transition: box-shadow .3s;
    }
    .avatar .relight[aria-pressed="true"] {
      box-shadow: 0 0 0 .3rem var(--link-color);
    }
    .avatar .relight canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border-radius: 50%; opacity: 0; transition: opacity .4s;
    }
    .avatar .relight.lit canvas { opacity: 1; }
    .avatar .relight.solid img { visibility: hidden; }
    .avatar .relight .bubble {
      position: absolute; left: 62%; bottom: 92%; z-index: 1;
      width: max-content; max-width: min(18rem, 45vw);
      padding: .6rem 1rem; border-radius: 1.2rem;
      font-size: 1.5rem; line-height: 1.4; text-align: left;
      color: var(--fg-color); background: var(--alt-bg-color);
      box-shadow: 0 .2rem .8rem rgb(0 0 0 / 25%);
      pointer-events: none; transform-origin: 0 100%;
      opacity: 0; transform: scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .6, 1);
    }
    /* Tail toward the mouth, lower left. */
    .avatar .relight .bubble::after {
      content: ""; position: absolute; left: 1rem; top: 100%;
      border: .6rem solid transparent; border-top-color: var(--alt-bg-color); border-left-color: var(--alt-bg-color);
    }
    .avatar .relight .bubble.flip { left: auto; right: 62%; transform-origin: 100% 100%; }
    .avatar .relight .bubble.flip::after {
      left: auto; right: 1rem;
      border-left-color: transparent; border-right-color: var(--alt-bg-color);
    }
    .avatar .relight .bubble.show { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .avatar .relight .bubble { transform: none; } }
    /* Parked off the home page while the mode is on: the bare cutout, shoulders on the
       window's bottom-left edge, clear of the theme's floating toggles on the right. */
    .avatar.avatar-dock {
      position: fixed; bottom: 0; left: 2rem; z-index: 100; line-height: 0;
      transition: transform .4s cubic-bezier(.3, 1.3, .6, 1);
    }
    .avatar.avatar-dock.gone { transform: translateY(100%); }
    .avatar.avatar-dock img { width: min(24rem, 40vw); border-radius: 0; }
    .avatar.avatar-dock .relight,
    .avatar.avatar-dock .relight[aria-pressed="true"] { background: none; box-shadow: none; border-radius: 0; }
    .avatar.avatar-dock .relight canvas { border-radius: 0; }
  </style>
